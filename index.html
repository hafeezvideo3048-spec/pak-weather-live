<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pak Weather Live | پاکستان کا روزانہ تازہ موسم</title>
  <meta name="description" content="Pak Weather Live provides accurate daily weather updates for all Pakistani cities in Urdu and English.">
  <style>
    body { font-family: Arial,sans-serif; margin:0; padding:0; background:#f2f6fc; color:#222; }
    header { background:#0b3d91; color:#fff; text-align:center; padding:20px 0; }
    header h1 { margin:0; font-size:28px; }
    nav { background:#084298; text-align:center; padding:10px 0; }
    nav a { color:#fff; text-decoration:none; margin:0 15px; font-weight:bold; }
    nav a:hover { text-decoration:underline; }
    .lang-toggle { text-align:center; margin:10px; }
    .lang-toggle button { margin:5px; padding:8px 16px; background:#0b3d91; border:none; border-radius:6px; color:white; cursor:pointer; font-weight:bold; }
    .lang-toggle button:hover { background:#062c66; }
    .slideshow { max-width:800px; margin:20px auto; border-radius:10px; overflow:hidden; box-shadow:0 2px 6px rgba(0,0,0,0.2); }
    .slides img { width:100%; height:400px; object-fit:cover; display:none; }
    main { max-width:800px; margin:30px auto; background:#fff; padding:25px; border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <header>
    <h1 id="siteTitle">Pak Weather Live</h1>
    <p id="siteSubtitle">پاکستان کا روزانہ تازہ موسم — Live Weather</p>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="privacy.html">Privacy</a>
    <a href="contact.html">Contact</a>
  </nav>

  <div class="lang-toggle">
    <button onclick="setLanguage('en')">English</button>
    <button onclick="setLanguage('ur')">اردو</button>
  </div>

  <div class="slideshow">
    <img src="https://upload.wikimedia.org/wikipedia/commons/2/21/Lahore_skyline.jpg" alt="Punjab">
    <img src="https://upload.wikimedia.org/wikipedia/commons/8/85/Karachi_skyline.jpg" alt="Sindh">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/63/Peshawar_city.jpg" alt="Khyber Pakhtunkhwa">
    <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Quetta_city.jpg" alt="Balochistan">
  </div>

  <main>
    <h2 id="weatherTitle">Check Live Weather</h2>
    <div class="search-box">
      <input id="city" type="text" placeholder="Enter city name — شہر کا نام لکھیں">
      <button onclick="getWeather()">Check</button>
    </div>
    <div id="weatherResult">Type a city name above to see live weather details.</div>
    <div id="forecast"></div>
  </main>

  <footer>
    <p>© 2025 Pak Weather Live</p>
    <a href="index.html">Home</a> |
    <a href="about.html">About</a> |
    <a href="privacy.html">Privacy</a> |
    <a href="contact.html">Contact</a>
  </footer>

<script>
  // Slideshow
  let slideIndex = 0;
  const slides = document.querySelectorAll('.slideshow img');
  function showSlides() {
    slides.forEach(img => img.style.display="none");
    slideIndex++;
    if(slideIndex>slides.length){slideIndex=1;}
    slides[slideIndex-1].style.display="block";
    setTimeout(showSlides,3000);
  }
  showSlides();

  // Language toggle
  function setLanguage(lang){
    if(lang==='ur'){
      document.getElementById('siteTitle').innerText="پاک ویڈر لائیو";
      document.getElementById('siteSubtitle').innerText="پاکستان کا روزانہ تازہ موسم — ہر شہر کا لائیو موسم";
      document.getElementById('weatherTitle').innerText="لائیو موسم چیک کریں";
    } else {
      document.getElementById('siteTitle').innerText="Pak Weather Live";
      document.getElementById('siteSubtitle').innerText="Daily Updated Weather for Every City";
      document.getElementById('weatherTitle').innerText="Check Live Weather";
    }
  }

  // Weather API
  async function getWeather(){
    const city=document.getElementById('city').value.trim();
    const apiKey="9bfb1b3ceca8abc8d244f976a01cc732";
    const resultDiv=document.getElementById('weatherResult');
    const forecastDiv=document.getElementById('forecast');
    if(!city){ resultDiv.innerHTML="<p>Please enter a city name.</p>"; return; }
    resultDiv.innerHTML="<p>Loading...</p>";
    try{
      const current=await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`);
      const currentData=await current.json();
      if(currentData.cod!==200) throw new Error();
      resultDiv.innerHTML=`<h3>${currentData.name}, ${currentData.sys.country}</h3>
      <p>🌡 ${currentData.main.temp} °C | 💧 ${currentData.main.humidity}% | 💨 ${currentData.wind.speed} m/s</p>
      <p>${currentData.weather[0].description}</p>`;
      const forecast=await fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${apiKey}&units=metric`);
      const forecastData=await forecast.json();
      forecastDiv.innerHTML="<h3>7-Day Forecast</h3>";
      let daysShown={};
      forecastData.list.forEach(item=>{
        const date=new Date(item.dt_txt).toDateString();
        if(!daysShown[date]){
          daysShown[date]=true;
          forecastDiv.innerHTML+=`<div><strong>${date}</strong><br>🌡 ${item.main.temp}°C | ${item.weather[0].description}<br><br></div>`;
        }
      });
    }catch{
      resultDiv.innerHTML="<p>City not found. Try again.</p>";
    }
  }
</script>
</body>
</html>
